interface:
  display_name: "Mermail Inbox Brief"
  short_description: "Evidence-bound inbox triage with drafts that stop for approval"
  default_prompt: "Use $mermail-inbox-brief when the task is to triage a Mermail mailbox — classify messages, score urgency, extract cited action items, and prepare reply drafts for approval — not to send, forward, schedule, delete, or configure triager automation."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
